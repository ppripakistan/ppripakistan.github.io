  <text x="54" y="543" font-size="11" fill="#334155">Key Policy Takeaway: Pakistan multiplied 7.2-fold in 72 years from 33.7 million in 1951 to 241.5 million in 2023. Annual growth currently stands at 2.55%, adding over 6.1 million people annually. 1951 Population: 33.7...</text>

