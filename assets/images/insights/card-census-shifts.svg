          </g>
          
  </g>

  <!-- Key Insight Box -->
  <rect x="40" y="510" width="720" height="48" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="527" font-size="10" font-weight="800" fill="#073c3a">KEY POLICY INSIGHT:</text>
  <text x="54" y="543" font-size="11" fill="#334155">Key Policy Takeaway: Significant federal rebalancing: Punjab&apos;s demographic share contracted by -3.2% (56.1% in 1981 to 52.9% in 2023), while Balochistan grew from 5.1% to 6.2% (14.89M) and KP reached 16.9% following t...</text>

