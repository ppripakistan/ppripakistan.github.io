  <text x="54" y="543" font-size="11" fill="#334155">Key Policy Takeaway: Pakistan&apos;s total public debt surged from PKR 24,953B in FY18 to PKR 83,285B in FY26 (+233.8%), while annual markup servicing expanded 6.5-fold from PKR 1,499B to PKR 9,775B. Total Debt: PKR 83,285...</text>

