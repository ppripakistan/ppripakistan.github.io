  <text x="54" y="543" font-size="11" fill="#334155">Key Policy Takeaway: Sovereign debt servicing absorbs 51.8% of the federal budget (PKR 9,775B), consuming 76.0% of net FBR tax collection and leaving only 7.4% (PKR 1,400B) for national development (PSDP). Markup Shar...</text>

