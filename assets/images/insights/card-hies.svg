  <text x="54" y="527" font-size="10" font-weight="800" fill="#073c3a">KEY POLICY INSIGHT:</text>
  <text x="54" y="543" font-size="11" fill="#334155">Key Policy Takeaway: Severe living standards divide: Rural Balochistan households spend 47.3% of their entire budget on basic food, compared to 28.2% in urban Islamabad. Rural families nationwide allocate an average o...</text>

