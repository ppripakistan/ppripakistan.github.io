  <text x="40" y="88" font-size="12" fill="#64748b">Share of household consumption absorbed by food staples across provinces and rural/urban divide</text>
  <line x1="40" y1="102" x2="760" y2="102" stroke="#e2e8f0" stroke-width="1.5"/>

