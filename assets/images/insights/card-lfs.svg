  <!-- Key Insight Box -->
  <rect x="40" y="510" width="720" height="48" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="527" font-size="10" font-weight="800" fill="#073c3a">KEY POLICY INSIGHT:</text>
  <text x="54" y="543" font-size="11" fill="#334155">Key Policy Takeaway: Severe gender chasm: Male labor force participation stands at 68.4% compared to only 21.6% for women (46.8% gap). Youth unemployment (age 15–24) reaches 18.6% (24.3% for young women). Male LFPR: 6...</text>

  <!-- Watermark Footer Banner (Two-Line Stacked: Zero Overlap) -->
  <rect x="0" y="568" width="800" height="52" fill="#073c3a" rx="0"/>
  <!-- Line 1: Primary Data Source (Full Canvas Width) -->
  <text x="40" y="589" font-size="10.5" font-weight="500" fill="#99f6e4">Source: Pakistan Bureau of Statistics, Labour Force Survey (LFS 2024–25)</text>
  <!-- Line 2: Institution Branding &amp; Canonical Domain -->
