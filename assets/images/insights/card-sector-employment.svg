  <!-- Key Insight Box -->
  <rect x="40" y="510" width="720" height="48" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="527" font-size="10" font-weight="800" fill="#073c3a">KEY POLICY INSIGHT:</text>
  <text x="54" y="543" font-size="11" fill="#334155">Key Policy Takeaway: Structural stagnation: Agriculture absorbs 37.4% of all employment nationwide (46.2% in Balochistan) while generating under 23% of GDP. Manufacturing and construction employ barely 25.4%, highligh...</text>

  <!-- Watermark Footer Banner (Two-Line Stacked: Zero Overlap) -->
