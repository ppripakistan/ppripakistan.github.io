    </style>
  </defs>

  <rect width="800" height="620" fill="#ffffff" rx="10" stroke="#cbd5e1" stroke-width="1"/>
  <rect width="800" height="6" fill="#0f766e" rx="4"/>

  <!-- Top Header with Number Badge -->
  <text x="40" y="38" font-size="11" font-weight="700" fill="#0f766e" letter-spacing="1">PAKISTAN PROVINCIAL REFORM INSTITUTE (PPRI) • INFOGRAPHIC 08 / 16 • HOUSING CENSUS • BASIC INFRASTRUCTURE</text>
  <text x="40" y="66" font-size="20" font-weight="800" fill="#073c3a">Household Basic Housing Characteristics &amp; Utilities Deficit</text>
  <text x="40" y="88" font-size="12" fill="#64748b">Provincial access rates for piped water, flush sanitation, grid electricity, and natural gas</text>
  <line x1="40" y1="102" x2="760" y2="102" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Core Visual Graphics -->
  <g transform="translate(83.33333333333331, 115) scale(1.0555555555555556)">
    
              <text x="166" y="66" text-anchor="end" font-size="12" font-weight="700" fill="#1e293b">Electricity Grid Access</text>
