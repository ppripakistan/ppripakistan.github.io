<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Datasets | PPRI</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body>
    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow">Open Research Data</span>
          <h1>Datasets</h1>
          <p>Machine-readable data and metadata used by PPRI.</p>
        </div>
      </section>
      <section class="section">
        <div class="container grid grid-2">
          <div class="card">
            <h3>Provincial population — CSV</h3>
            <p>Census 2023 province-level baseline.</p>
            <a class="btn btn-primary" href="/data/provinces/provinces-2023.csv"
              >Download</a
            >
          </div>
          <div class="card">
            <h3>Provincial population — JSON</h3>
            <p>Machine-readable version for the comparison interface.</p>
            <a
              class="btn btn-primary"
              href="/data/provinces/provinces-2023.json"
              >Download</a
            >
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
